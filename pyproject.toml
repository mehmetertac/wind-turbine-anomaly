[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-turbine-anomaly"
version = "0.1.0"
description = "Gearbox failure prediction on EDP wind turbine SCADA — pure ML vs physics-residual hybrid"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch==2.15.0+cpu",
    "matplotlib>=3.7",
    "shap>=0.43",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pre-commit>=3.5",
    "setuptools>=68",
    "wheel",
]

[tool.pip-tools]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
emit-index-url = true
emit-trusted-host = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--assert=plain"
